<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/svg+xml" href="img/icon.svg">
  <title>Площадки в твоем городе — Street Spot</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="header">
    <div class="container header-container">
      <div class="header-brand">
        <a href="index.html" class="logo">Street Spot</a>
        <p class="city-picker">Город: <span>Екатеринбург</span></p>
      </div>

      <button type="button" class="nav-toggle" aria-label="Открыть меню" aria-expanded="false">
        <span class="nav-toggle-line"></span>
        <span class="nav-toggle-line"></span>
        <span class="nav-toggle-line"></span>
      </button>

      <nav class="nav" aria-label="Основная навигация">
        <ul class="nav-list">
          <li class="nav-item"><a href="courts.html" class="nav-link active" aria-current="page">Площадки</a></li>
          <li class="nav-item"><a href="login.html" class="nav-link">Вход / Регистрация</a></li>
          <li class="nav-item"><a href="profile.html" class="nav-link">Личный кабинет</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main class="main-content">
    <div class="container">
      <section class="section">
        <h1 class="section-title">Площадки в твоем городе</h1>

        <div class="catalog-controls">
          <div class="search-input-group catalog-search">
            <label for="catalog-query" class="skrytyy">Поиск площадки</label>
            <input type="search" id="catalog-query" class="form-input catalog-query" placeholder="Поиск по названию или адресу">
          </div>

          <select class="form-control catalog-filter-surface" aria-label="Покрытие">
            <option value="all">Все покрытия</option>
            <option value="Резина">Резиновая крошка</option>
            <option value="Асфальт">Асфальт</option>
            <option value="Паркет">Паркет / Зал</option>
          </select>

          <select class="form-control catalog-sort" aria-label="Сортировка">
            <option value="default">По умолчанию</option>
            <option value="name-asc">Название: А → Я</option>
            <option value="name-desc">Название: Я → А</option>
            <option value="rating">По рейтингу</option>
            <option value="players">По числу игроков</option>
          </select>
        </div>

        <p class="catalog-count-line">Найдено: <span class="catalog-count">0</span></p>

        <div class="catalog-state" aria-live="polite">
          <p class="catalog-state-text"></p>
          <button type="button" class="btn btn-accent catalog-retry" hidden>Повторить попытку</button>
        </div>

        <div class="setka-kartochek" id="courts-list"></div>

        <p class="catalog-empty" hidden>Площадки не найдены</p>

        <div class="banner">
          <p class="tekst-bannera">Нету площадки?</p>
          <a href="add-court.html" class="btn btn-accent">Добавить площадку</a>
        </div>
      </section>
    </div>
  </main>

  <footer class="footer">
    <div class="container footer-container">
      <section class="footer-info">
        <p class="footer-copy">&copy; 2026 Street Spot. Все права защищены.</p>
        <ul class="footer-links">
          <li><a href="#" class="footer-link">О сервисе</a></li>
          <li><a href="#" class="footer-link">Служба поддержки</a></li>
        </ul>
      </section>
    </div>
  </footer>

  <script src="js/api.js"></script>
  <script src="js/script.js"></script>

</body>
</html>
