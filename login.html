<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Вход — Street Spot</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-body">

  <a href="index.html" class="logo auth-logo">Street Spot</a>

  <main class="auth-wrapper">
    <section class="court-card auth-card">
      <div class="auth-header">
        <h1 class="auth-title">Войти на Street Spot</h1>
      </div>

      <form action="#" method="post" class="auth-form">
        <div class="form-group">
          <label for="email" class="form-label">Email</label>
          <input type="email" id="email" name="email" class="form-control" placeholder="example@mail.ru" autocomplete="email" required>
        </div>

        <div class="form-group">
          <label for="password" class="form-label">Пароль</label>
          <input type="password" id="password" name="password" class="form-control" placeholder="••••••••" autocomplete="current-password" required>
        </div>

        <p class="auth-switch-text">
          Нет аккаунта? 
          <a href="register.html" class="auth-link">Регистрация</a>
        </p>

        <button type="submit" class="btn btn-accent btn-block btn-large">Войти</button>
      </form>
    </section>
  </main>

</body>
</html>
