<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/svg+xml" href="img/icon.svg">
  <title>Регистрация — Street Spot</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-body">

  <a href="index.html" class="logo auth-logo">Street Spot</a>

  <main class="auth-wrapper">
    <section class="court-card auth-card">
      <div class="auth-header">
        <h1 class="auth-title">Регистрация</h1>
      </div>

      <form action="#" method="post" class="auth-form">
        <div class="form-group">
          <label for="reg-email" class="form-label">Email</label>
          <input type="email" id="reg-email" name="email" class="form-control" placeholder="example@mail.ru" autocomplete="email" required>
        </div>

        <div class="form-group">
          <label for="reg-password" class="form-label">Придумайте пароль</label>
          <input type="password" id="reg-password" name="password" class="form-control" placeholder="••••••••" autocomplete="new-password" required minlength="6">
        </div>

        <div class="form-group">
          <label for="reg-password-confirm" class="form-label">Повторите пароль</label>
          <input type="password" id="reg-password-confirm" name="password_confirm" class="form-control" placeholder="••••••••" autocomplete="new-password" required minlength="6">
        </div>

        <p class="auth-switch-text">
          Уже есть аккаунт? 
          <a href="login.html" class="auth-link">Войти</a>
        </p>

        <button type="submit" class="btn btn-accent btn-block btn-large">Зарегистрироваться</button>
      </form>
    </section>
  </main>

</body>
</html>
